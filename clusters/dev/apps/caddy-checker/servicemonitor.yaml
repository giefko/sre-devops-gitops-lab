apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: caddy-checker
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app: caddy-checker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
